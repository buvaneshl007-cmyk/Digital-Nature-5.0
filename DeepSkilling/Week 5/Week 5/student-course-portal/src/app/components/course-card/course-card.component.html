<div class="card" [ngClass]="cardClasses" [ngStyle]="borderStyle" [appHighlight]="'#fff8c4'">
  <h3>{{ course.name }}</h3>
  <p class="meta">{{ course.code }} &middot; {{ course.credits | creditLabel }}</p>

  <span [ngSwitch]="course.gradeStatus" class="badge">
    <span *ngSwitchCase="'passed'" class="badge badge--passed">Passed</span>
    <span *ngSwitchCase="'failed'" class="badge badge--failed">Failed</span>
    <span *ngSwitchCase="'pending'" class="badge badge--pending">Pending</span>
  </span>

  <div class="actions">
    <button type="button" (click)="onEnrollClick()">
      {{ (enrolledIds$ | async)?.includes(course.id) ? 'Unenroll' : 'Enroll' }}
    </button>
    <button type="button" class="secondary" (click)="toggleExpanded()">Show Details</button>
  </div>

  <div class="details" *ngIf="isExpanded">
    <p>Course ID: {{ course.id }}</p>
    <p>Grade status: {{ course.gradeStatus }}</p>
  </div>
</div>
