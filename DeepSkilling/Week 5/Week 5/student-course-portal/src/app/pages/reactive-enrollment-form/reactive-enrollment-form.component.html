<section class="form-page">
  <h2>Enrollment Request (Reactive Form)</h2>

  <form [formGroup]="enrollForm" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="studentName">Student Name</label>
      <input id="studentName" formControlName="studentName" />
      <span
        class="error"
        *ngIf="
          enrollForm.get('studentName')?.touched && enrollForm.get('studentName')?.errors?.['required']
        "
        >Name is required</span
      >
      <span
        class="error"
        *ngIf="
          enrollForm.get('studentName')?.touched &&
          enrollForm.get('studentName')?.errors?.['minlength']
        "
        >Name must be at least 3 characters</span
      >
    </div>

    <div class="field">
      <label for="studentEmail">Email</label>
      <input id="studentEmail" formControlName="studentEmail" />
      <span
        class="error"
        *ngIf="enrollForm.get('studentEmail')?.pending"
        >Checking email availability...</span
      >
      <span
        class="error"
        *ngIf="enrollForm.get('studentEmail')?.touched && enrollForm.get('studentEmail')?.errors?.['emailTaken']"
        >This email is already taken</span
      >
    </div>

    <div class="field">
      <label for="courseId">Course ID</label>
      <input id="courseId" formControlName="courseId" />
      <span
        class="error"
        *ngIf="enrollForm.get('courseId')?.errors?.['noCourseCode']"
        >Course code starting with XX is not allowed.</span
      >
    </div>

    <div class="field">
      <label for="preferredSemester">Preferred Semester</label>
      <select id="preferredSemester" formControlName="preferredSemester">
        <option value="Odd">Odd</option>
        <option value="Even">Even</option>
      </select>
    </div>

    <div class="field checkbox">
      <label>
        <input type="checkbox" formControlName="agreeToTerms" />
        I agree to the terms
      </label>
    </div>

    <div class="field">
      <label>Additional Courses</label>
      <div class="array-row" *ngFor="let ctrl of additionalCourses.controls; let i = index">
        <input [formControl]="$any(ctrl)" placeholder="Course code" />
        <button type="button" class="secondary" (click)="removeCourse(i)">Remove</button>
      </div>
      <button type="button" class="secondary" (click)="addCourse()">Add Another Course</button>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="enrollForm.invalid">Submit</button>
    </div>

    <p class="success" *ngIf="submitted">Enrollment request submitted successfully!</p>
  </form>
</section>
